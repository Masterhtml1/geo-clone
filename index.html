<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06081a">
<title>Pulse Vector</title>
<style>
  :root {
    --bg: #06081a; --panel: rgba(10, 14, 40, 0.92); --line: rgba(160, 200, 255, 0.35);
    --text: #f4f7ff; --muted: #9aa6d6; --green: #3dff7a; --cyan: #2ee8ff; --pink: #ff4fd8; --gold: #ffd23f;
    --btn-a: #5dff8c; --btn-b: #18b84a;
    color-scheme: dark;
  }
  @media (prefers-reduced-motion: reduce) { .logo .w span, .play-btn, .banner { animation: none !important; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  canvas#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .screen.active { display: flex; }
  .overlay { background: rgba(3, 5, 18, 0.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }

  /* ---------- logo ---------- */
  .logo { text-align: center; line-height: 0.92; margin-bottom: clamp(18px, 5vh, 48px); font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif; font-weight: 900; }
  .logo .w { display: block; font-size: clamp(42px, 10vw, 120px); letter-spacing: 0.04em; font-style: italic;
    background: linear-gradient(180deg, #fff 0%, #b8fff0 35%, #2ee8ff 60%, #3d6bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2px #000) drop-shadow(0 4px 0 #0a1250) drop-shadow(0 0 18px rgba(46, 232, 255, 0.55)); }
  .logo .w2 { background: linear-gradient(180deg, #fff 0%, #ffe2a8 35%, #ffb52e 60%, #ff4fd8 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 2px #000) drop-shadow(0 4px 0 #4a0a40) drop-shadow(0 0 18px rgba(255, 79, 216, 0.55)); }
  .logo .w span { display: inline-block; animation: bob 1.8s ease-in-out infinite; background: inherit; -webkit-background-clip: text; background-clip: text; color: transparent; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .menu-row { display: flex; align-items: center; gap: clamp(18px, 4vw, 44px); }
  .play-btn { width: clamp(110px, 18vw, 170px); height: clamp(110px, 18vw, 170px); border-radius: 26%;
    background: radial-gradient(circle at 35% 30%, #c8ffb0, #5dff8c 40%, #12a83e 100%);
    box-shadow: 0 0 0 5px #0b3a1a, 0 0 0 8px #7dffa6, 0 0 40px rgba(61, 255, 122, 0.6), inset 0 -10px 0 rgba(0, 60, 20, 0.35);
    display: grid; place-items: center; animation: pulse 0.9s ease-in-out infinite; transition: transform 0.12s; }
  .play-btn:hover { transform: scale(1.06); } .play-btn:active { transform: scale(0.95); }
  .play-btn .tri { width: 0; height: 0; border-left: 50px solid #fff; margin-left: 10%;
    border-top: clamp(26px, 4.4vw, 40px) solid transparent; border-bottom: clamp(26px, 4.4vw, 40px) solid transparent; border-left-width: clamp(40px, 7vw, 62px);
    filter: drop-shadow(0 3px 0 #0b3a1a); }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 5px #0b3a1a, 0 0 0 8px #7dffa6, 0 0 30px rgba(61, 255, 122, 0.45), inset 0 -10px 0 rgba(0, 60, 20, 0.35) }
    50% { box-shadow: 0 0 0 5px #0b3a1a, 0 0 0 8px #7dffa6, 0 0 60px rgba(61, 255, 122, 0.85), inset 0 -10px 0 rgba(0, 60, 20, 0.35) } }
  .round-btn { width: clamp(64px, 10vw, 92px); height: clamp(64px, 10vw, 92px); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9fe8ff, #2ea8ff 45%, #1648b8 100%);
    box-shadow: 0 0 0 4px #081a40, 0 0 0 6px #8fd8ff, 0 0 22px rgba(46, 168, 255, 0.5), inset 0 -6px 0 rgba(0, 20, 60, 0.35);
    display: grid; place-items: center; transition: transform 0.12s; }
  .round-btn:hover { transform: scale(1.08); } .round-btn:active { transform: scale(0.94); }
  .round-btn canvas { width: 60%; height: 60%; }
  .round-btn svg { width: 56%; height: 56%; }
  .menu-hint { margin-top: clamp(18px, 4vh, 40px); color: var(--muted); font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; text-align: center; }

  /* ---------- generic UI ---------- */
  .title { font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif; font-size: clamp(26px, 5vw, 44px); letter-spacing: 0.04em; margin: 0 0 14px;
    text-shadow: 0 3px 0 #0a1250, 0 0 16px rgba(46, 232, 255, 0.5); text-align: center; }
  .back-btn { position: absolute; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); width: 54px; height: 54px; border-radius: 14px;
    background: linear-gradient(#5dff8c, #18b84a); box-shadow: 0 0 0 3px #0b3a1a, inset 0 -5px 0 rgba(0, 60, 20, 0.35); font-size: 30px; font-weight: 900; line-height: 1;
    color: #fff; text-shadow: 0 2px 0 #0b3a1a; }
  .btn { padding: 12px 22px; border-radius: 14px; font-weight: 800; font-size: 17px; letter-spacing: 0.03em; color: #fff;
    background: linear-gradient(#5dff8c, #18b84a); box-shadow: 0 0 0 3px #0b3a1a, inset 0 -5px 0 rgba(0, 60, 20, 0.35); text-shadow: 0 2px 0 #0b3a1a;
    transition: transform 0.1s; min-width: 120px; }
  .btn:hover { transform: translateY(-1px) scale(1.03); } .btn:active { transform: scale(0.96); }
  .btn.blue { background: linear-gradient(#6fd0ff, #1f7fe0); box-shadow: 0 0 0 3px #06204a, inset 0 -5px 0 rgba(0, 20, 60, 0.35); text-shadow: 0 2px 0 #06204a; }
  .btn.pink { background: linear-gradient(#ff8fe6, #d42ab0); box-shadow: 0 0 0 3px #4a0a40, inset 0 -5px 0 rgba(60, 0, 40, 0.35); text-shadow: 0 2px 0 #4a0a40; }
  .btn.gold { background: linear-gradient(#ffe27a, #e0a010); box-shadow: 0 0 0 3px #4a3000, inset 0 -5px 0 rgba(60, 40, 0, 0.35); text-shadow: 0 2px 0 #4a3000; }
  .btn.red { background: linear-gradient(#ff8a7a, #d42a2a); box-shadow: 0 0 0 3px #4a0a0a, inset 0 -5px 0 rgba(60, 0, 0, 0.35); text-shadow: 0 2px 0 #4a0a0a; }
  .btn.on { background: linear-gradient(#5dff8c, #18b84a); }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: clamp(16px, 3vw, 28px); box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(46, 232, 255, 0.12);
    width: min(560px, 100%); max-height: 100%; overflow-y: auto; }

  /* ---------- progress bars ---------- */
  .bar-label { font-size: 13px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin: 10px 0 4px; }
  .bar { position: relative; height: 22px; border-radius: 11px; background: rgba(0, 0, 0, 0.55); border: 2px solid rgba(255, 255, 255, 0.25); overflow: hidden; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(#7dffa6, #18b84a); border-radius: 9px; transition: width 0.3s; }
  .bar.practice .fill { background: linear-gradient(#7fe8ff, #1f8fe0); }
  .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 13px; text-shadow: 0 1px 2px #000; }

  /* ---------- level select ---------- */
  .ls-wrap { display: flex; align-items: center; gap: clamp(8px, 2vw, 22px); width: min(780px, 100%); }
  .arrow { flex: none; width: clamp(44px, 7vw, 64px); height: clamp(64px, 12vw, 96px); border-radius: 14px; font-size: clamp(34px, 6vw, 54px); font-weight: 900;
    color: #fff; background: linear-gradient(#5dff8c, #18b84a); box-shadow: 0 0 0 3px #0b3a1a, inset 0 -5px 0 rgba(0, 60, 20, 0.35); text-shadow: 0 2px 0 #0b3a1a; }
  .arrow:active { transform: scale(0.94); }
  .level-card { flex: 1; min-width: 0; border-radius: 22px; padding: clamp(14px, 3vw, 26px); cursor: pointer;
    background: linear-gradient(160deg, rgba(40, 70, 200, 0.95), rgba(20, 30, 100, 0.95)); border: 3px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 10px 0 rgba(0, 0, 0, 0.35), 0 0 40px rgba(46, 232, 255, 0.25); transition: transform 0.15s; }
  .level-card:hover { transform: translateY(-3px); } .level-card:active { transform: scale(0.98); }
  .lc-top { display: flex; align-items: center; gap: clamp(10px, 2.5vw, 22px); }
  .lc-top canvas { width: clamp(64px, 12vw, 104px); height: clamp(64px, 12vw, 104px); flex: none; }
  .lc-name { font-family: "Arial Black", "Segoe UI Black", Impact, sans-serif; font-size: clamp(22px, 4.4vw, 38px); line-height: 1.05; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45); }
  .lc-meta { margin-top: 6px; color: #dfe6ff; font-weight: 700; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .lc-stars { color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 63, 0.6); }
  .lc-done { color: var(--green); }
  .dots { display: flex; gap: 10px; margin-top: 18px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); }
  .dots i.on { background: #fff; box-shadow: 0 0 10px #fff; }
  .ls-hint { margin-top: 14px; color: var(--muted); font-size: 13px; letter-spacing: 0.08em; }

  /* ---------- customize ---------- */
  #customPreview { width: min(640px, 100%); height: auto; aspect-ratio: 640 / 120; border-radius: 16px; background: rgba(0, 0, 0, 0.35); border: 2px solid var(--line); }
  .swatches, .icons { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 34px; height: 34px; border-radius: 9px; border: 3px solid rgba(255, 255, 255, 0.25); }
  .swatch.sel { border-color: #fff; box-shadow: 0 0 12px #fff; }
  .icon-opt { width: 52px; height: 52px; border-radius: 12px; background: rgba(0, 0, 0, 0.35); border: 3px solid rgba(255, 255, 255, 0.2); padding: 4px; }
  .icon-opt.sel { border-color: #fff; box-shadow: 0 0 12px #fff; }
  .icon-opt canvas { width: 100%; height: 100%; }
  .section-h { margin: 14px 0 8px; font-size: 13px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }

  /* ---------- settings / options ---------- */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
  .row label { font-weight: 700; }
  input[type=range] { width: min(240px, 50vw); accent-color: var(--green); }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--green); }
  .check { display: flex; align-items: center; gap: 10px; font-weight: 700; padding: 6px 0; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.active { display: block; }
  .progress { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; }
  .pbar { width: min(40vw, 420px); height: 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.55); overflow: hidden; }
  .pfill { height: 100%; width: 0; background: linear-gradient(90deg, #7dffa6, #3dff7a); box-shadow: 0 0 10px #3dff7a; }
  .pfill.practice { background: linear-gradient(90deg, #7fe8ff, #2ea8ff); box-shadow: 0 0 10px #2ea8ff; }
  .ptext { font-weight: 900; font-size: 16px; min-width: 52px; text-shadow: 0 2px 0 #000, 0 0 8px rgba(0, 0, 0, 0.8); }
  .pause-btn { pointer-events: auto; position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 46px; height: 46px; border-radius: 12px;
    background: rgba(0, 0, 0, 0.35); border: 2px solid rgba(255, 255, 255, 0.55); display: grid; place-items: center; }
  .pause-btn::before { content: ""; width: 16px; height: 18px; border-left: 6px solid #fff; border-right: 6px solid #fff; box-sizing: border-box; }
  #practiceBtns { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: none; gap: 18px; pointer-events: auto; }
  #practiceBtns.active { display: flex; }
  .cp-btn { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.5); }
  .cp-btn .dia { width: 26px; height: 26px; transform: rotate(45deg); background: #3dff7a; box-shadow: 0 0 12px #3dff7a; border: 2px solid #0b3a1a; }
  .cp-btn .dia.rm { background: #ff4f6a; box-shadow: 0 0 12px #ff4f6a; border-color: #4a0a14; position: relative; }
  .cp-btn small { position: absolute; bottom: -18px; font-size: 11px; color: #fff; opacity: 0.8; letter-spacing: 0.06em; }
  .cp-btn { position: relative; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); font-family: "Arial Black", Impact, sans-serif; font-size: clamp(26px, 5vw, 46px);
    color: #fff; text-shadow: 0 3px 0 #000, 0 0 20px rgba(61, 255, 122, 0.8); pointer-events: none; opacity: 0; transition: opacity 0.25s, transform 0.25s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, -60%); }

  /* ---------- pause ---------- */
  .pause-name { font-family: "Arial Black", Impact, sans-serif; font-size: clamp(24px, 4vw, 36px); text-align: center; margin-bottom: 6px; text-shadow: 0 3px 0 #000; }
  .pause-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 18px 0 10px; }
  .pause-opts { display: flex; flex-wrap: wrap; gap: 4px 22px; justify-content: center; margin-top: 8px; }
  .mode-tag { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ---------- complete ---------- */
  .banner { font-family: "Arial Black", Impact, sans-serif; font-size: clamp(34px, 8vw, 78px); font-style: italic; text-align: center;
    background: linear-gradient(180deg, #fff, #fff27a 45%, #ffb52e); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #5a2a00) drop-shadow(0 0 24px rgba(255, 210, 63, 0.7)); animation: pop 0.6s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes pop { from { transform: scale(0.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; width: min(520px, 100%); }
  .stat { background: rgba(0, 0, 0, 0.4); border: 2px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; }
  .stat b { display: block; font-size: clamp(22px, 4vw, 32px); }
  .stat small { color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-size: 11px; }
  .row-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  #rotateHint { display: none; }
  @media (orientation: portrait) and (max-width: 600px) { #rotateHint { display: block; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- MAIN MENU -->
<div id="scr-menu" class="screen active">
  <div class="logo" aria-label="Pulse Vector">
    <span class="w"><span>P</span><span style="animation-delay:.08s">U</span><span style="animation-delay:.16s">L</span><span style="animation-delay:.24s">S</span><span style="animation-delay:.32s">E</span></span>
    <span class="w w2"><span style="animation-delay:.4s">V</span><span style="animation-delay:.48s">E</span><span style="animation-delay:.56s">C</span><span style="animation-delay:.64s">T</span><span style="animation-delay:.72s">O</span><span style="animation-delay:.8s">R</span></span>
  </div>
  <div class="menu-row">
    <button class="round-btn" id="btnCustom" aria-label="Customize icon"><canvas id="menuIcon" width="96" height="96"></canvas></button>
    <button class="play-btn" id="btnPlay" aria-label="Play"><span class="tri"></span></button>
    <button class="round-btn" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" stroke="#081a40" stroke-width="1" d="M10.3 1.8h3.4l.5 2.6 1.7.7 2.2-1.5 2.4 2.4-1.5 2.2.7 1.7 2.6.5v3.4l-2.6.5-.7 1.7 1.5 2.2-2.4 2.4-2.2-1.5-1.7.7-.5 2.6h-3.4l-.5-2.6-1.7-.7-2.2 1.5-2.4-2.4 1.5-2.2-.7-1.7-2.6-.5v-3.4l2.6-.5.7-1.7-1.5-2.2 2.4-2.4 2.2 1.5 1.7-.7zM12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
    </button>
  </div>
  <div class="menu-hint">Space · Click · Tap to jump &nbsp;|&nbsp; Esc pause &nbsp;|&nbsp; R restart</div>
  <div class="menu-hint" id="rotateHint">Rotate your device for a wider view</div>
</div>

<!-- LEVEL SELECT -->
<div id="scr-levels" class="screen">
  <button class="back-btn" data-back aria-label="Back">‹</button>
  <div class="ls-wrap">
    <button class="arrow" id="lsPrev" aria-label="Previous level">‹</button>
    <div class="level-card" id="levelCard" role="button" tabindex="0" aria-label="Play level">
      <div class="lc-top">
        <canvas id="faceCv" width="160" height="160"></canvas>
        <div style="min-width:0">
          <div class="lc-name" id="lcName"></div>
          <div class="lc-meta"><span id="lcDiff"></span><span class="lc-stars" id="lcStars"></span><span class="lc-done" id="lcDone"></span></div>
        </div>
      </div>
      <div class="bar-label">Normal Mode</div>
      <div class="bar"><div class="fill" id="lcNormal"></div><span id="lcNormalT"></span></div>
      <div class="bar-label">Practice Mode</div>
      <div class="bar practice"><div class="fill" id="lcPractice"></div><span id="lcPracticeT"></span></div>
    </div>
    <button class="arrow" id="lsNext" aria-label="Next level">›</button>
  </div>
  <div class="dots" id="lsDots"></div>
  <div class="ls-hint">Click the card to play · ← → to browse</div>
</div>

<!-- CUSTOMIZE -->
<div id="scr-custom" class="screen">
  <button class="back-btn" data-back aria-label="Back">‹</button>
  <div class="panel" style="width:min(700px,100%)">
    <div class="title">Customize</div>
    <canvas id="customPreview" width="1280" height="240"></canvas>
    <div class="section-h">Primary colour</div><div class="swatches" id="swPrimary"></div>
    <div class="section-h">Secondary colour</div><div class="swatches" id="swSecondary"></div>
    <div class="section-h">Icon</div><div class="icons" id="iconOpts"></div>
  </div>
</div>

<!-- SETTINGS -->
<div id="scr-settings" class="screen">
  <button class="back-btn" data-back aria-label="Back">‹</button>
  <div class="panel">
    <div class="title">Settings</div>
    <div class="row"><label for="volMaster">Master volume</label><input type="range" id="volMaster" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="volMusic">Music</label><input type="range" id="volMusic" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="volSfx">Sound effects</label><input type="range" id="volSfx" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="setHitbox">Show hitboxes (P)</label><input type="checkbox" id="setHitbox"></div>
    <div class="row"><label for="setPracHitbox">Show hitboxes in practice</label><input type="checkbox" id="setPracHitbox"></div>
    <div class="row"><label for="setDecimals">Percentage decimals</label><input type="checkbox" id="setDecimals"></div>
    <div class="row"><label for="setHideAttempts">Hide attempt counter</label><input type="checkbox" id="setHideAttempts"></div>
    <div class="row"><label>Save data</label><button class="btn red" id="btnReset">Reset</button></div>
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="progress" id="hudProgress"><div class="pbar" id="hudBar"><div class="pfill" id="hudFill"></div></div><div class="ptext" id="hudPct">0%</div></div>
  <button class="pause-btn" id="btnPause" aria-label="Pause"></button>
  <div id="practiceBtns">
    <button class="cp-btn" id="btnCpPlace" aria-label="Place checkpoint (Z)"><span class="dia"></span><small>Z</small></button>
    <button class="cp-btn" id="btnCpRemove" aria-label="Remove checkpoint (X)"><span class="dia rm"></span><small>X</small></button>
  </div>
</div>
<div id="toast"></div>

<!-- PAUSE -->
<div id="scr-pause" class="screen overlay">
  <div class="panel">
    <div class="pause-name" id="pauseName"></div>
    <div class="mode-tag" id="pauseMode"></div>
    <div class="bar-label">Normal Mode</div>
    <div class="bar"><div class="fill" id="pNormal"></div><span id="pNormalT"></span></div>
    <div class="bar-label">Practice Mode</div>
    <div class="bar practice"><div class="fill" id="pPractice"></div><span id="pPracticeT"></span></div>
    <div class="pause-btns">
      <button class="btn" id="pResume">▶ Resume</button>
      <button class="btn blue" id="pRestart">↻ Restart</button>
      <button class="btn gold" id="pPracticeBtn">◆ Practice</button>
      <button class="btn pink" id="pQuit">⌂ Menu</button>
    </div>
    <div class="pause-opts">
      <label class="check"><input type="checkbox" id="optProgress"> Show Progress Bar</label>

<script>
'use strict';
// @@CORE_START
// =====================================================================
// SECTION: Config — every tunable value lives here
// =====================================================================
const CONFIG = {
  // --- timing ---
  PHYSICS_HZ: 240,              // fixed physics step
  MAX_FRAME_TIME: 0.25,         // clamp for long frames (tab switches)

  // --- rendering scale ---
  PX_PER_UNIT_AT_720P: 30,      // 1 block = 30px at 1280x720
  REF_W: 1280, REF_H: 720,
  PLAYER_SCREEN_X: 1 / 3,       // player locked ~1/3 from the left

  // --- horizontal speeds (blocks / second) ---
  SPEEDS: [8.372, 10.386, 12.914, 15.6, 19.2],
  SPEED_NAMES: ['Slow', 'Normal', 'Fast', 'Faster', 'Fastest'],

  // --- player body ---
  PLAYER_SIZE: 1,
  MINI_SCALE: 0.6,
  INNER_HITBOX: 0.4,            // inner (crash) hitbox, fraction of size
  WAVE_HITBOX: 0.5,             // wave uses a smaller body, fraction of size
  SNAP_FRACTION: 0.3,           // how deep into a block top we still count as "landing"
  INPUT_BUFFER_TICKS: 3,        // a press stays usable this many extra physics ticks

  // --- game modes ---
  CUBE:   { JUMP_VEL: 18.7, GRAVITY: 83, TERMINAL_VEL: 26, MINI_JUMP_MULT: 0.894, ROT_SPEED: Math.PI / 0.4506 },
  SHIP:   { THRUST: 52, GRAVITY: 44, MAX_UP: 9.5, MAX_DOWN: 10.5, MINI_ACCEL_MULT: 1.2, MINI_MAX_MULT: 0.92, ENTRY_VEL_MULT: 0.5 },
  BALL:   { GRAVITY: 70, TERMINAL_VEL: 24, FLIP_VEL: 3 },
  UFO:    { HOP_VEL: 12.5, GRAVITY: 55, TERMINAL_VEL: 16, MINI_HOP_MULT: 0.85 },
  WAVE:   { ANGLE_DEG: 45, MINI_ANGLE_DEG: 63.4 },
  ROBOT:  { THRUST_VEL: 11, MAX_HOLD: 0.2, GRAVITY: 83, TERMINAL_VEL: 26, MINI_MULT: 0.85 },
  SPIDER: { GRAVITY: 83, TERMINAL_VEL: 26, RANGE: 30 },
  SWING:  { GRAVITY: 44, MAX_VEL: 11 },
  GRAV_PORTAL_VEL_MULT: 0.5,    // vertical velocity kept when a gravity portal flips you

  // --- pads & orbs (blocks / second, along "up" relative to gravity) ---
  PAD_VEL: { yellow: 22.4, pink: 14, red: 29, blue: 8 },
  ORB_VEL: { yellow: 18.7, pink: 13.5, red: 25, blue: 6, green: 18.7, black: 28 },
  MODE_BOUNCE_MULT: { cube: 1, robot: 1, spider: 1, ball: 0.75, ufo: 0.75, ship: 0.55, swing: 0.55, wave: 0 },
  MINI_BOUNCE_MULT: 0.85,
  ORB_HALF: 0.6,                // orb hitbox half-size (square)
  PAD_DEPTH: 0.3,

  // --- hazards ---
  SPIKE_HB_W: 0.4, SPIKE_HB_H: 0.6,
  SAW_HB_SCALE: 0.7,

  // --- portals & corridors ---
  PORTAL_HEIGHT: 3,
  CORRIDOR_HEIGHT: { ship: 10, ufo: 10, wave: 10, swing: 10, ball: 8 },
  OOB_TOP: 40, OOB_BOTTOM: -20,

  // --- camera ---
  CAMERA: { DEAD_TOP: 0.62, DEAD_BOTTOM: 0.3, FOLLOW_RATE: 5, SNAP_RATE: 7, GROUND_FRAC: 0.22, SHAKE_DEATH: 0.35, SHAKE_DECAY: 3 },

  // --- flow ---
  DEATH_PAUSE: 1.0,
  COMPLETE_DELAY: 1.7,

  // --- practice ---
  PRACTICE: { AUTO_INTERVAL: 1.6, BEHIND_TIME: 0.5, GROUND_TICKS: 8, HISTORY_STEP: 0.05 },

  // --- audio ---
  AUDIO: { LOOKAHEAD: 0.14, SCHED_MS: 25, START_DELAY: 0.06, MASTER: 0.8, MUSIC: 0.7, SFX: 0.8 },

  SAVE_KEY: 'pulsevector.save.v1',
};

const TICK = 1 / CONFIG.PHYSICS_HZ;
const MODES = ['cube', 'ship', 'ball', 'ufo', 'wave', 'robot', 'spider', 'swing'];
const MODE_COLORS = { cube: '#3dff7a', ship: '#ff4fd8', ball: '#ff5a2a', ufo: '#ffb52e', wave: '#2ee8ff', robot: '#e8eef5', spider: '#a15bff', swing: '#ffd23f' };
const ORB_COLORS = { yellow: '#ffe23a', pink: '#ff6ad5', red: '#ff3b3b', blue: '#38b6ff', green: '#3dff7a', black: '#20202a' };
const GROUND_MODES = new Set(['cube', 'ball', 'robot', 'spider']);
const CORRIDOR_MODES = new Set(['ship', 'ball', 'ufo', 'wave', 'swing']);

// Object categories
const SOLID = 1, HAZARD = 2, PAD = 3, ORB = 4, PORTAL = 5, TRIGGER = 6, DECO = 7;
const TYPE_CAT = { block: SOLID, spike: HAZARD, halfspike: HAZARD, saw: HAZARD, pad: PAD, orb: ORB, portal: PORTAL, color: TRIGGER, terrain: DECO };

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function r3(v) { return Math.round(v * 1000) / 1000; }
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// =====================================================================
// SECTION: Level data
// Levels are arrays of {type, x, y, rotation, extra} objects plus metadata.
// They are authored with a small beat-aware builder so that obstacles sit
// on the music grid: builder.beats(n) advances by n beats at the current speed.
// =====================================================================
class LevelBuilder {
  constructor(meta) {
    this.meta = meta; this.si = meta.startSpeed; this.x = 0; this.base = 0;
    this.objects = []; this.corr = null; this.marks = [];
  }
  mark(name) { this.marks.push([r3(this.x), name]); return this; }
  get speed() { return CONFIG.SPEEDS[this.si]; }
  get bpb() { return this.speed * 60 / this.meta.bpm; }           // blocks per beat
  beats(n) { this.x += n * this.bpb; return this; }
  add(type, dx, y, rotation, extra) {
    this.objects.push({ type, x: r3(this.x + dx), y: r3(y), rotation: rotation || 0, extra: extra || {} });
    return this;
  }
  block(dx, y, w = 1, h = 1, extra = {}) { return this.add('block', dx, y, 0, Object.assign({ w: r3(w), h: r3(h) }, extra)); }
  spike(dx, y = this.base, rot = 0) { return this.add('spike', dx, y, rot); }
  spikes(dx, n, y = this.base, rot = 0) { for (let i = 0; i < n; i++) this.spike(dx + i, y, rot); return this; }
  half(dx, y = this.base, rot = 0) { return this.add('halfspike', dx, y, rot); }
  halves(dx, n, y = this.base, rot = 0) { for (let i = 0; i < n; i++) this.half(dx + i, y, rot); return this; }
  saw(dx, y, r = 1) { return this.add('saw', dx, y, 0, { r }); }
  pad(dx, color, y = this.base, rot = 0) { return this.add('pad', dx, y, rot, { color }); }
  orb(dx, y, color) { return this.add('orb', dx, y, 0, { color }); }
  // Mode portal. opts: {floor, ceil, h, y}
  mode(dx, mode, y, opts = {}) {
    const ch = CONFIG.CORRIDOR_HEIGHT[mode];
    if (ch) { const f = opts.floor != null ? opts.floor : 0; this.corr = { floor: f, ceil: opts.ceil != null ? opts.ceil : f + ch }; }
    else this.corr = opts.ceil != null ? { floor: opts.floor || 0, ceil: opts.ceil } : null;
    return this.add('portal', dx, y, 0, Object.assign({ kind: 'mode', mode }, opts));
  }
  grav(dx, g, y, h) { return this.add('portal', dx, y, 0, { kind: 'gravity', g, h }); }
  size(dx, size, y, h) { return this.add('portal', dx, y, 0, { kind: 'size', size, h }); }
  speedTo(si, y, h) { this.add('portal', 0, y, 0, { kind: 'speed', speed: si, h }); this.si = si; return this; }
  // Cube helpers: offsets are derived from the jump arc so the jump window is centred on the beat.
  cs(n) { return r3(0.2255 * this.speed - 0.5 - (n - 1) / 2); }
  jump(n = 1, y = this.base, rot = 0) { return this.spikes(rot === 180 ? this.cs(n) : this.cs(n), n, y, rot); }
  orbPit(color = 'yellow') {
    const ax = 0.2253 * this.speed;
    this.orb(ax - 0.5, this.base + 2, color);
    return this.spikes(ax - 1, Math.floor(0.515 * this.speed + 0.3));
  }
  color(dx, bg, ground, len = 16) { return this.add('color', dx, 0, 0, { bg, ground, len }); }

  // A tunnel through the current corridor. center(d) gives the centre line at d blocks from the start.
  tunnel(len, center, gap, colW = 0.5) {
    const c = this.corr; const x0 = this.x;
    const top = [], bot = [];
    for (let d = 0; d < len - 1e-6; d += colW) {
      const w = Math.min(colW, len - d);
      const cy = center(d + w / 2);
      const lo = r3(cy - gap / 2), hi = r3(cy + gap / 2);
      if (lo > c.floor + 0.01) this.block(d, c.floor, w, lo - c.floor, { hidden: 1 });
      if (hi < c.ceil - 0.01) this.block(d, hi, w, c.ceil - hi, { hidden: 1 });
      bot.push([r3(x0 + d), Math.max(lo, c.floor)], [r3(x0 + d + w), Math.max(lo, c.floor)]);
      top.push([r3(x0 + d), Math.min(hi, c.ceil)], [r3(x0 + d + w), Math.min(hi, c.ceil)]);
    }
    this.objects.push({ type: 'terrain', x: r3(x0), y: c.floor, rotation: 0, extra: { pts: bot, base: c.floor, w: r3(len) } });
    this.objects.push({ type: 'terrain', x: r3(x0), y: c.ceil, rotation: 0, extra: { pts: top, base: c.ceil, w: r3(len) } });
    return this;
  }
  build(tail = 12) {
    const length = r3(this.x + tail);
    return Object.assign({}, this.meta, { objects: this.objects, length, marks: this.marks });
  }
}

// ---- helper shapes used by several levels ----
function sineCenter(mid, amp, period, phase = 0) { return (d) => mid + amp * Math.sin((d / period) * Math.PI * 2 + phase); }
function zigCenter(start, slope, segLen, lo, hi) {
  // triangle wave starting at `start`, going up first, bouncing between lo and hi
  return (d) => {
    const span = hi - lo; const per = 2 * span / slope;
    let u = ((d * 1) + (start - lo) / slope) % per; if (u < 0) u += per;
    const p = u * slope; return p <= span ? lo + p : hi - (p - span);
  };
}

// ---------------- LEVEL 1: First Light (cube only, normal speed) ----------------
function buildLevel1() {
  const b = new LevelBuilder({
    id: 'first-light', name: 'First Light', difficulty: 'Easy', stars: 1,
    bpm: 133, seed: 1101, startSpeed: 1, startMode: 'cube',
    colors: { bg: '#1d4fe0', ground: '#173bb0' }, music: { style: 0 },
  });
  b.beats(8);
  b.mark('singles'); for (let i = 0; i < 4; i++) { b.jump(1); b.beats(2); }
  b.mark('doubles'); for (let i = 0; i < 3; i++) { b.jump(2); b.beats(2); }
  b.mark('on the beat'); for (let i = 0; i < 3; i++) { b.jump(1); b.beats(1); } b.beats(1);
  b.color(0, '#5a22d8', '#3e159c', 24);
  b.mark('first platform');
  b.block(2, 0, b.bpb * 4 - 2, 1); b.base = 1;
  b.beats(1); b.jump(1); b.beats(3);
  b.base = 0; b.beats(1);
  b.mark('yellow pads');
  b.beats(1); b.pad(0, 'yellow'); b.spikes(0.6, 4); b.beats(3);
  b.pad(0, 'yellow'); b.spikes(0.6, 4); b.beats(3);
  b.mark('stairs');
  b.block(2, 0, b.bpb * 2, 1); b.base = 1; b.beats(1);
  b.block(2.4, 0, b.bpb * 2 + 2, 2); b.base = 2; b.beats(2);
  b.jump(1); b.beats(2);
  b.base = 0; b.beats(1.5);
  b.color(0, '#c0208f', '#8a1468', 24);
  b.mark('yellow orbs');
  for (let i = 0; i < 3; i++) { b.beats(1); b.orbPit(); b.beats(2); }
  b.beats(1);
  b.mark('pink pad');
  b.pad(0, 'pink'); b.spike(0.85); b.block(-1, 2.6, 4, 1); b.spikes(-1, 4, 3.6); b.beats(2);
  b.jump(1); b.beats(2);
  b.mark('pillars');
  {
    const p1 = 2.4, p2 = p1 + b.bpb, p3 = p2 + b.bpb;
    for (const p of [p1, p2, p3]) b.block(p, 0, 1.5, 2);
    for (const [a, c] of [[p1 + 1.5, p2], [p2 + 1.5, p3]]) for (let d = a + 0.2; d + 1 <= c - 0.2; d += 1) b.spike(d, 0);
    b.spikes(p3 + 1.7, 2, 0);
    b.beats(5);
  }
  b.color(0, '#1aa37a', '#0f7556', 24);
  b.mark('red pad');
  b.pad(0, 'red'); b.block(3, 0, b.bpb * 2, 4); b.spikes(0.6, 2); b.base = 4;
  b.beats(2); b.jump(1); b.beats(2);
  b.base = 0; b.beats(1.5);
  b.mark('mixed rhythm');
  b.jump(1); b.beats(1); b.jump(2); b.beats(1); b.jump(1); b.beats(2);
  b.color(0, '#d0602a', '#94401a', 24);
  b.mark('three steps');
  {
    const end = 2 + b.bpb * 4;
    b.block(2, 0, end - 2, 1); b.beats(1);
    b.block(2, 1, end - 2 - b.bpb, 1); b.beats(1);
    b.block(2, 2, end - 2 - 2 * b.bpb, 1); b.beats(1);
    b.base = 3; b.jump(1); b.beats(1);
    b.base = 0; b.beats(2);
  }
  b.mark('orb chain');
  {
    const ax = 0.2253 * b.speed;
    for (let k = 0; k < 3; k++) b.orb(ax - 0.5 + k * b.bpb, 2, 'yellow');
    b.spikes(ax - 1, Math.floor(2 * b.bpb + 0.515 * b.speed + 0.3));
    b.beats(5);
  }
  b.color(0, '#2850e0', '#1a36a8', 24);
  b.mark('finale');
  b.jump(2); b.beats(2);
  b.jump(1); b.beats(1); b.jump(2); b.beats(2);
  b.jump(3); b.beats(2);
  b.orbPit(); b.beats(3);
  b.pad(0, 'yellow'); b.spikes(0.6, 4); b.beats(3);
  b.jump(1); b.beats(1); b.jump(1); b.beats(1); b.jump(1); b.beats(4);
  return b.build(14);
}

  b.block(2, 0, 1.5, 4); b.beats(1.5);
  b.block(2, 6.5, 1.5, 3.5); b.beats(1.5);
  b.block(2, 0, 1.5, 3.5); b.beats(1.5);
  b.saw(2, 7, 1); b.saw(2 + b.bpb, 2.5, 1); b.beats(2);

const LEVELS = [buildLevel1(), buildLevel2(), buildLevel3(), buildLevel4()];

// =====================================================================
// SECTION: Objects — normalise level objects into hitboxes + spatial grid
// =====================================================================
function prepareLevel(def) {
  const objs = [], decos = [], triggers = [];
  for (const o of def.objects) {
    const e = o.extra || {};
    const p = { type: o.type, x: o.x, y: o.y, rot: ((o.rotation || 0) % 360 + 360) % 360, extra: e, cat: TYPE_CAT[o.type], idx: 0 };
    switch (o.type) {
      case 'block': p.x0 = o.x; p.y0 = o.y; p.x1 = o.x + (e.w || 1); p.y1 = o.y + (e.h || 1); break;
      case 'spike': case 'halfspike': {
        const d = o.type === 'spike' ? 1 : 0.5, hw = CONFIG.SPIKE_HB_W, hh = CONFIG.SPIKE_HB_H * d;
        const m = (1 - hw) / 2;
        if (p.rot === 0) { p.x0 = o.x + m; p.x1 = o.x + 1 - m; p.y0 = o.y; p.y1 = o.y + hh; }
        else if (p.rot === 180) { p.x0 = o.x + m; p.x1 = o.x + 1 - m; p.y0 = o.y + 1 - hh; p.y1 = o.y + 1; }
        else if (p.rot === 90) { p.x0 = o.x; p.x1 = o.x + hh; p.y0 = o.y + m; p.y1 = o.y + 1 - m; }
        else { p.x0 = o.x + 1 - hh; p.x1 = o.x + 1; p.y0 = o.y + m; p.y1 = o.y + 1 - m; }
        break;
      }
      case 'saw': { const r = e.r || 1; p.cx = o.x + 0.5; p.cy = o.y + 0.5; p.r = r; p.hr = r * CONFIG.SAW_HB_SCALE; p.x0 = p.cx - r; p.x1 = p.cx + r; p.y0 = p.cy - r; p.y1 = p.cy + r; break; }
      case 'pad': p.x0 = o.x + 0.1; p.x1 = o.x + 0.9;
        if (p.rot === 180) { p.y0 = o.y + 1 - CONFIG.PAD_DEPTH; p.y1 = o.y + 1; } else { p.y0 = o.y; p.y1 = o.y + CONFIG.PAD_DEPTH; }
        break;
      case 'orb': p.cx = o.x + 0.5; p.cy = o.y + 0.5; p.x0 = p.cx - CONFIG.ORB_HALF; p.x1 = p.cx + CONFIG.ORB_HALF; p.y0 = p.cy - CONFIG.ORB_HALF; p.y1 = p.cy + CONFIG.ORB_HALF; break;
      case 'portal': { const h = e.h || CONFIG.PORTAL_HEIGHT; p.cx = o.x + 0.5; p.cy = o.y + 0.5; p.ph = h; p.x0 = o.x + 0.2; p.x1 = o.x + 0.8; p.y0 = p.cy - h / 2; p.y1 = p.cy + h / 2; break; }
      case 'color': triggers.push(p); continue;
      case 'terrain': p.x0 = o.x; p.x1 = o.x + (e.w || 0); decos.push(p); continue;
      default: continue;
    }
    p.idx = objs.length; objs.push(p);
  }
  triggers.sort((a, b) => a.x - b.x);
  const cols = [];
  for (const p of objs) {
    const c0 = Math.max(0, Math.floor(p.x0)), c1 = Math.max(0, Math.floor(p.x1));
    for (let c = c0; c <= c1; c++) (cols[c] || (cols[c] = [])).push(p.idx);
  }
  return { def, meta: def, objs, decos, triggers, cols, length: def.length, stamp: new Int32Array(objs.length), qid: 0, tmp: [] };
}

// Returns (a reused array of) objects whose column range touches [x0, x1].
function query(L, x0, x1) {
  const out = L.tmp; out.length = 0;
  const q = ++L.qid;
  const c1 = Math.floor(x1);
  for (let c = Math.max(0, Math.floor(x0)); c <= c1; c++) {
    const a = L.cols[c]; if (!a) continue;
    for (let k = 0; k < a.length; k++) {
      const i = a[k]; if (L.stamp[i] === q) continue;
      L.stamp[i] = q; out.push(L.objs[i]);
    }
  }
  return out;
}

// Colors are a pure function of x, so checkpoints and restarts need no extra state.
function colorsAt(L, x) {
  let bg = hexToRgb(L.meta.colors.bg), gr = hexToRgb(L.meta.colors.ground);
  for (const t of L.triggers) {
    if (t.x > x) break;
    const f = clamp((x - t.x) / (t.extra.len || 1), 0, 1);
    bg = lerpRgb(bg, hexToRgb(t.extra.bg), f); gr = lerpRgb(gr, hexToRgb(t.extra.ground), f);
  }
  return { bg, ground: gr };
}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function lerpRgb(a, b, f) { return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }

// =====================================================================
// SECTION: Physics — player state + fixed-step simulation
// =====================================================================
function createState(L) {
  const m = L.meta;
  const s = {
    x: 0, y: 0.5, vy: 0, mode: m.startMode || 'cube', grav: 1, mini: false,
    speedIdx: m.startSpeed, speed: CONFIG.SPEEDS[m.startSpeed], grounded: true, corridor: null,
    robotT: 0, buf: 0, used: [], dead: false, done: false, cause: '', jumps: 0, t: 0, groundTicks: 0,
  };
  const ch = CONFIG.CORRIDOR_HEIGHT[s.mode];
  if (ch) s.corridor = { floor: 0, ceil: ch };
  return s;
}
function cloneState(s) {
  const c = Object.assign({}, s);
  c.used = s.used.slice();
  c.corridor = s.corridor ? { floor: s.corridor.floor, ceil: s.corridor.ceil } : null;
  return c;
}
function playerSize(s) { return s.mini ? CONFIG.MINI_SCALE * CONFIG.PLAYER_SIZE : CONFIG.PLAYER_SIZE; }
function bodyHalf(s) { const h = playerSize(s) / 2; return s.mode === 'wave' ? h * CONFIG.WAVE_HITBOX : h; }
function emit(ev, type, data) { if (ev) ev.push(Object.assign({ type }, data)); }
function die(s, cause, ev) { if (s.dead) return; s.dead = true; s.cause = cause; emit(ev, 'death', { cause }); }

// One physics tick. held = button currently down, pressed = a fresh press happened since last tick.
function stepSim(L, s, held, pressed, ev) {
  if (s.dead || s.done) return;
  if (pressed) s.buf = CONFIG.INPUT_BUFFER_TICKS + 1;
  const hold = held || pressed;
  const h = bodyHalf(s);

  // ---- orbs (need a fresh / buffered press) ----
  if (s.buf > 0) {
    const near = query(L, s.x - h - 1, s.x + h + 1);
    for (let i = 0; i < near.length; i++) {
      const o = near[i];
      if (o.cat !== ORB || s.used.indexOf(o.idx) >= 0) continue;
      if (s.x - h < o.x1 && s.x + h > o.x0 && s.y - h < o.y1 && s.y + h > o.y0) {
        if (applyOrb(s, o, ev)) { s.used.push(o.idx); s.buf = 0; s.grounded = false; break; }
      }
    }
  }

  // ---- mode-specific vertical motion ----
  updateMode(L, s, hold, ev);
  if (s.buf > 0) s.buf--;

  // ---- integrate ----
  s.x += s.speed * TICK;
  s.y += s.vy * TICK;

  // ---- collisions ----
  resolveSolids(L, s, ev);
  if (s.dead) return;
  touchObjects(L, s, ev);
  checkHazards(L, s, ev);
  if (s.dead) return;
  if (!s.corridor && (s.y > CONFIG.OOB_TOP || s.y < CONFIG.OOB_BOTTOM)) { die(s, 'out of bounds', ev); return; }

  s.t += TICK;
  s.groundTicks = s.grounded ? s.groundTicks + 1 : 0;
  while (s.used.length && L.objs[s.used[0]].x1 < s.x - 3) s.used.shift();
  if (s.x >= L.length) { s.done = true; emit(ev, 'complete'); }
}

// =====================================================================
// SECTION: Player modes
// =====================================================================
function clampFall(s, term) { if (s.vy * s.grav < -term) s.vy = -s.grav * term; }

function updateMode(L, s, hold, ev) {
  const g = s.grav, mini = s.mini, dt = TICK;
  switch (s.mode) {
    case 'cube': {
      const C = CONFIG.CUBE;
      if (s.grounded && (hold || s.buf > 0)) {
        s.vy = g * C.JUMP_VEL * (mini ? C.MINI_JUMP_MULT : 1);
        s.grounded = false; s.buf = 0; s.jumps++; emit(ev, 'jump');
      }
      s.vy -= g * C.GRAVITY * dt; clampFall(s, C.TERMINAL_VEL);
      break;
    }
    case 'ship': {
      const S = CONFIG.SHIP, am = mini ? S.MINI_ACCEL_MULT : 1, mm = mini ? S.MINI_MAX_MULT : 1;
      s.vy += g * (hold ? S.THRUST : -S.GRAVITY) * am * dt;
      const rel = clamp(s.vy * g, -S.MAX_DOWN * mm, S.MAX_UP * mm); s.vy = rel * g;
      break;
    }
    case 'ball': {
      const B = CONFIG.BALL;
      if (s.grounded && s.buf > 0) {
        s.buf = 0; s.grav = -g; s.vy = g * B.FLIP_VEL; s.grounded = false; s.jumps++; emit(ev, 'flip');
      }
      s.vy -= s.grav * B.GRAVITY * dt; clampFall(s, B.TERMINAL_VEL);
      break;
    }
    case 'ufo': {
      const U = CONFIG.UFO;
      if (s.buf > 0) {
        s.buf = 0; s.vy = g * U.HOP_VEL * (mini ? U.MINI_HOP_MULT : 1); s.grounded = false; s.jumps++; emit(ev, 'jump');
      }
      s.vy -= g * U.GRAVITY * dt; clampFall(s, U.TERMINAL_VEL);
      break;
    }
    case 'wave': {
      const ang = (mini ? CONFIG.WAVE.MINI_ANGLE_DEG : CONFIG.WAVE.ANGLE_DEG) * Math.PI / 180;
      const v = s.speed * Math.tan(ang);
      const nv = (hold ? g : -g) * v;
      if (Math.sign(nv) !== Math.sign(s.vy) && s.vy !== 0) emit(ev, 'wavepoint');
      s.vy = nv;
      break;
    }
    case 'robot': {
      const R = CONFIG.ROBOT, k = mini ? R.MINI_MULT : 1;
      if (s.grounded && (hold || s.buf > 0)) {
        s.buf = 0; s.robotT = R.MAX_HOLD; s.grounded = false; s.jumps++; emit(ev, 'jump');
      }
      if (s.robotT > 0 && hold) { s.vy = g * R.THRUST_VEL * k; s.robotT -= dt; }
      else { s.robotT = 0; s.vy -= g * R.GRAVITY * dt; clampFall(s, R.TERMINAL_VEL); }
      break;
    }
    case 'spider': {
      const P = CONFIG.SPIDER;
      if (s.grounded && s.buf > 0) { s.buf = 0; spiderTeleport(L, s, ev); }
      s.vy -= s.grav * P.GRAVITY * dt; clampFall(s, P.TERMINAL_VEL);
      break;
    }
    case 'swing': {
      const W = CONFIG.SWING;
      if (s.buf > 0) { s.buf = 0; s.grav = -g; s.jumps++; emit(ev, 'flip'); }
      s.vy -= s.grav * W.GRAVITY * dt; s.vy = clamp(s.vy, -W.MAX_VEL, W.MAX_VEL);
      break;
    }
  }
}

function spiderTeleport(L, s, ev) {
  const h = bodyHalf(s), up = s.grav; // travel opposite to gravity
  let target = null;
  const near = query(L, s.x - h, s.x + h);
  if (up > 0) {
    let best = s.corridor ? s.corridor.ceil : Infinity;
    for (const o of near) if (o.cat === SOLID && o.x0 < s.x + h - 0.01 && o.x1 > s.x - h + 0.01 && o.y0 >= s.y + h - 0.05 && o.y0 < best) best = o.y0;
    if (best - s.y <= CONFIG.SPIDER.RANGE) target = best - h;
  } else {
    let best = s.corridor ? s.corridor.floor : 0;
    for (const o of near) if (o.cat === SOLID && o.x0 < s.x + h - 0.01 && o.x1 > s.x - h + 0.01 && o.y1 <= s.y - h + 0.05 && o.y1 > best) best = o.y1;
    target = best + h;
  }
  const y0 = s.y;
  if (target !== null) { s.y = target; s.vy = 0; }
  s.grav = -s.grav; s.grounded = false; s.jumps++;
  emit(ev, 'teleport', { x: s.x, y0, y1: s.y });
}

// =====================================================================
// SECTION: Collision
// =====================================================================
function landOn(s, gravSide) { // gravSide: +1 = surface below, -1 = surface above
  if (gravSide > 0) { if (s.vy < 0) s.vy = 0; if (s.grav > 0) s.grounded = true; }
  else { if (s.vy > 0) s.vy = 0; if (s.grav < 0) s.grounded = true; }
}

function resolveSolids(L, s, ev) {
  const size = playerSize(s), h = bodyHalf(s), isWave = s.mode === 'wave';
  const snap = size * CONFIG.SNAP_FRACTION;
  const wasGrounded = s.grounded;
  s.grounded = false;
  // level floor / corridor floor and ceiling (always safe surfaces)
  const floorY = s.corridor ? s.corridor.floor : 0;
  if (s.y - h <= floorY) { s.y = floorY + h; landOn(s, 1); }
  if (s.corridor && s.y + h >= s.corridor.ceil) { s.y = s.corridor.ceil - h; landOn(s, -1); }

  const near = query(L, s.x - h - 0.01, s.x + h + 0.01);
  for (let i = 0; i < near.length; i++) {
    const o = near[i];
    if (o.cat !== SOLID) continue;
    if (!(s.x - h < o.x1 && s.x + h > o.x0 && s.y - h < o.y1 && s.y + h > o.y0)) continue;
    if (isWave) { die(s, 'wave hit block', ev); return; }
    const topPen = o.y1 - (s.y - h), botPen = (s.y + h) - o.y0;
    if (topPen <= botPen && topPen <= snap) { s.y = o.y1 + h; landOn(s, 1); }
    else if (botPen < topPen && botPen <= snap) { s.y = o.y0 - h; landOn(s, -1); }
  }
  // inner hitbox: touching a block here means a side hit or a crush
  const ih = size * CONFIG.INNER_HITBOX / 2;
  for (let i = 0; i < near.length; i++) {
    const o = near[i];

const R = { cv: document.getElementById('cv'), ctx: null, W: 0, H: 0, dpr: 1, ppu: 30 };
R.ctx = R.cv.getContext('2d');
function resize() {
  R.dpr = Math.min(window.devicePixelRatio || 1, 2);

  R.cv.width = Math.round(R.W * R.dpr); R.cv.height = Math.round(R.H * R.dpr);

window.addEventListener('resize', resize);
resize();

const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

}
function setWorld(ctx) {

}

function drawBackground(ctx, pal, pulse) {
  setScreen(ctx);

  g.addColorStop(0, rgb(pal.top)); g.addColorStop(1, rgb(pal.bottom));
  ctx.fillStyle = g; ctx.fillRect(0, 0, R.W, R.H);

  const layers = [[0.08, 9, 5.5, 0.06], [0.25, 6.5, 2.6, 0.09]];
  ctx.lineWidth = 2;

    const px = cam.x * par, py = cam.y * par * 0.5;

    ctx.strokeStyle = rgb(pal.line, alpha * (1 + pulse * 0.8));

}

function drawGroundAndCeiling(ctx, pal, vis) {
  setScreen(ctx);
  const tileU = 4;
  const drawSlab = (yWorld, up) => {
    const [, sy] = toScreen(0, yWorld);
    if (up ? sy < 0 : sy > R.H) return;
    const y0 = up ? 0 : sy, y1 = up ? sy : R.H;
    const g = ctx.createLinearGradient(0, sy, 0, up ? sy - R.ppu * 6 : sy + R.ppu * 6);
    g.addColorStop(0, rgb(pal.ground)); g.addColorStop(1, rgb(mix(pal.ground, BLACK, 0.55)));

    const off = ((cam.x % tileU) + tileU) % tileU;
    ctx.beginPath();
    for (let x = -off * R.ppu; x < R.W; x += tileU * R.ppu) { ctx.moveTo(x, sy); ctx.lineTo(x, up ? sy - tileU * R.ppu : sy + tileU * R.ppu); }

}

function spikePts(o, depth) {
  const cx = o.x + 0.5, cy = o.y + 0.5, a = o.rot * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const base = -0.5, tip = -0.5 + depth;
  const local = [[-0.5, base], [0.5, base], [0, tip]];

}

function drawObjects(ctx, L, pal, pulse, t, usedSet) {
  setWorld(ctx);
  const x0 = cam.x - 3, x1 = cam.x + viewW() + 3;
  const vis = query(L, x0, x1).slice();
  const lw = 2.2 / R.ppu;

  // terrain (tunnel walls)
  for (const d of L.decos) {
    if (d.x1 < x0 || d.x0 > x1) continue;
    const pts = d.extra.pts, base = d.extra.base;
    ctx.beginPath(); ctx.moveTo(pts[0][0], base);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.lineTo(pts[pts.length - 1][0], base); ctx.closePath();
    ctx.fillStyle = rgb(pal.fill, 0.92); ctx.fill();
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) ctx.lineTo(p[0], p[1]);
    ctx.save(); ctx.shadowColor = rgb(pal.line); ctx.shadowBlur = 10 * R.dpr;
    ctx.strokeStyle = rgb(pal.line, 0.75 + pulse * 0.25); ctx.lineWidth = lw * 1.4; ctx.stroke(); ctx.restore();
  }

  // blocks
  ctx.beginPath();
  for (const o of vis) if (o.cat === SOLID && !o.extra.hidden) ctx.rect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0);
  ctx.fillStyle = rgb(pal.fill, 0.94); ctx.fill();
  ctx.save(); ctx.shadowColor = rgb(pal.line); ctx.shadowBlur = 9 * R.dpr;
  ctx.strokeStyle = rgb(pal.line, 0.78 + pulse * 0.22); ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
  ctx.beginPath();
  for (const o of vis) if (o.cat === SOLID && !o.extra.hidden && o.x1 - o.x0 > 0.5 && o.y1 - o.y0 > 0.5) ctx.rect(o.x0 + 0.18, o.y0 + 0.18, o.x1 - o.x0 - 0.36, o.y1 - o.y0 - 0.36);
  ctx.strokeStyle = rgb(pal.line, 0.16); ctx.lineWidth = lw * 0.8; ctx.stroke();

  // spikes
  ctx.beginPath();
  for (const o of vis) if (o.type === 'spike' || o.type === 'halfspike') {
    const p = spikePts(o, o.type === 'spike' ? 1 : 0.5);
    ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]); ctx.lineTo(p[2][0], p[2][1]); ctx.closePath();
  }
  ctx.fillStyle = rgb(mix(pal.fill, BLACK, 0.3), 0.96); ctx.fill();
  ctx.save(); ctx.shadowColor = rgb(pal.line); ctx.shadowBlur = 8 * R.dpr;
  ctx.strokeStyle = rgb(WHITE, 0.7 + pulse * 0.3); ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();

  for (const o of vis) {
    if (o.type === 'saw') {
      ctx.save(); ctx.translate(o.cx, o.cy); ctx.rotate(-t * 5);
      const teeth = 14, r = o.r;
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) { const a = (i / (teeth * 2)) * Math.PI * 2, rr = i % 2 ? r * 0.82 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = rgb(mix(pal.fill, BLACK, 0.3)); ctx.fill();
      ctx.shadowColor = rgb(pal.line); ctx.shadowBlur = 10 * R.dpr; ctx.strokeStyle = rgb(WHITE, 0.75 + pulse * 0.25); ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.45, 0); ctx.lineTo(r * 0.45, 0); ctx.moveTo(0, -r * 0.45); ctx.lineTo(0, r * 0.45); ctx.stroke();
      ctx.restore();
    } else if (o.type === 'pad') {
      const col = ORB_COLORS[o.extra.color], up = o.rot !== 180, by = up ? o.y : o.y + 1;
      ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = (12 + pulse * 10) * R.dpr; ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(o.x + 0.5, by, 0.42, 0.26 + pulse * 0.04, 0, up ? 0 : Math.PI, up ? Math.PI : Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = rgb(WHITE, 0.5); ctx.beginPath(); ctx.ellipse(o.x + 0.5, by + (up ? 0.05 : -0.05), 0.22, 0.08, 0, 0, Math.PI * 2); ctx.fill();

      ctx.lineWidth = lw * 1.2; ctx.strokeStyle = o.extra.color === 'black' ? '#ffffff' : rgb(WHITE, 0.9); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0, 0, 0.6 + pulse * 0.08, t * 3, t * 3 + Math.PI * 1.4); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
      ctx.beginPath(); ctx.arc(-0.12, 0.12, 0.12, 0, Math.PI * 2); ctx.fillStyle = rgb(WHITE, 0.6); ctx.fill();

    const g = ctx.createLinearGradient(ex - 3, 0, ex + 0.3, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.55)');

function portalColor(o) {
  const e = o.extra;

  if (e.kind === 'size') return e.size === 'mini' ? '#ff6ad5' : '#3dff7a';

}
function drawPortal(ctx, o, pulse, lw) {
  const col = portalColor(o), e = o.extra;
  ctx.save(); ctx.translate(o.cx, o.cy);
  if (o.ph > 4) { // tall trigger column: faint light beam over the full hitbox
    const g = ctx.createLinearGradient(-0.3, 0, 0.3, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, col); g.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.strokeStyle = col; ctx.lineWidth = lw * 2.2; ctx.lineJoin = 'round';
    for (let i = 0; i < n; i++) {
      const dx = (i - (n - 1) / 2) * 0.32;
      ctx.beginPath(); ctx.moveTo(dx - 0.16, 0.6); ctx.lineTo(dx + 0.16, 0); ctx.lineTo(dx - 0.16, -0.6); ctx.stroke();
    }

    const ry = 1.45;
    ctx.beginPath(); ctx.ellipse(0, 0, 0.42, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = col; ctx.globalAlpha = 0.18; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = lw * 3; ctx.strokeStyle = col; ctx.stroke();
    ctx.lineWidth = lw; ctx.strokeStyle = rgb(WHITE, 0.85); ctx.beginPath(); ctx.ellipse(0, 0, 0.28, ry - 0.18, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = lw * 1.2;

      ctx.beginPath();
      if (d) { ctx.moveTo(0, -0.45 * d); ctx.lineTo(-0.16, 0.05 * -d); ctx.lineTo(0.16, 0.05 * -d); ctx.closePath(); ctx.fill(); }
      else { ctx.moveTo(0, 0.5); ctx.lineTo(-0.14, 0.2); ctx.lineTo(0.14, 0.2); ctx.closePath(); ctx.moveTo(0, -0.5); ctx.lineTo(-0.14, -0.2); ctx.lineTo(0.14, -0.2); ctx.closePath(); ctx.fill(); }
    } else if (e.kind === 'size') {
      const s = e.size === 'mini' ? 0.16 : 0.3; ctx.strokeRect(-s / 2, -s / 2, s, s);

}
// tiny white silhouettes used inside mode portals (drawn in a y-down local space)
function drawModeGlyph(ctx, mode, s) {
  ctx.beginPath();
  switch (mode) {
    case 'cube': ctx.rect(-s / 2, -s / 2, s, s); ctx.stroke(); break;
    case 'ship': ctx.moveTo(-s * 0.6, s * 0.3); ctx.lineTo(s * 0.6, 0); ctx.lineTo(-s * 0.6, -s * 0.3); ctx.closePath(); ctx.stroke(); break;
    case 'ball': ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2); ctx.stroke(); break;
    case 'ufo': ctx.ellipse(0, s * 0.1, s * 0.6, s * 0.22, 0, 0, Math.PI * 2); ctx.moveTo(s * 0.3, 0); ctx.arc(0, 0, s * 0.3, 0, Math.PI, true); ctx.stroke(); break;
    case 'wave': ctx.moveTo(-s * 0.5, s * 0.4); ctx.lineTo(-s * 0.1, -s * 0.3); ctx.lineTo(s * 0.2, s * 0.2); ctx.lineTo(s * 0.55, -s * 0.4); ctx.stroke(); break;
    case 'robot': ctx.rect(-s * 0.3, -s * 0.5, s * 0.6, s * 0.55); ctx.moveTo(-s * 0.2, s * 0.05); ctx.lineTo(-s * 0.3, s * 0.5); ctx.moveTo(s * 0.2, s * 0.05); ctx.lineTo(s * 0.3, s * 0.5); ctx.stroke(); break;
    case 'spider': ctx.ellipse(0, -s * 0.1, s * 0.35, s * 0.22, 0, 0, Math.PI * 2); for (const k of [-1, 1]) { ctx.moveTo(k * s * 0.2, 0); ctx.lineTo(k * s * 0.55, s * 0.45); } ctx.stroke(); break;

// ---------- player icons (screen space, y down, unit = 1 block = `u` px) ----------
function drawCubeIcon(ctx, u, prim, sec, style) {
  const h = u / 2;
  ctx.fillStyle = prim; ctx.fillRect(-h, -h, u, u);
  ctx.fillStyle = sec; ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1, u * 0.07);
  switch (style) {
    case 0: ctx.fillRect(-h * 0.5, -h * 0.5, h, h); ctx.strokeRect(-h * 0.5, -h * 0.5, h, h); break;
    case 1: ctx.fillRect(-h * 0.6, -h * 0.45, h * 0.38, h * 0.55); ctx.fillRect(h * 0.22, -h * 0.45, h * 0.38, h * 0.55);
      ctx.fillRect(-h * 0.6, h * 0.35, h * 1.2, h * 0.2); break;
    case 2: ctx.save(); ctx.rotate(Math.PI / 4); ctx.fillRect(-h * 0.85, -h * 0.17, h * 1.7, h * 0.34); ctx.fillRect(-h * 0.17, -h * 0.85, h * 0.34, h * 1.7); ctx.restore(); break;
    case 3: ctx.beginPath(); ctx.arc(0, 0, h * 0.52, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = prim; ctx.beginPath(); ctx.arc(0, 0, h * 0.2, 0, Math.PI * 2); ctx.fill(); break;
    case 4: ctx.fillRect(-h * 0.75, -h * 0.35, h * 1.5, h * 0.42); ctx.strokeRect(-h * 0.75, -h * 0.35, h * 1.5, h * 0.42); ctx.fillRect(-h * 0.3, h * 0.35, h * 0.6, h * 0.25); break;
    case 5: ctx.beginPath(); ctx.moveTo(0, -h * 0.7); ctx.lineTo(h * 0.7, 0); ctx.lineTo(0, h * 0.7); ctx.lineTo(-h * 0.7, 0); ctx.closePath(); ctx.fill(); ctx.stroke(); break;

// Draws the player for any mode. o: {mode, u(px per block * size), rot, vy, speed, grav, x, grounded, t}
function drawPlayerShape(ctx, o, prim, sec, style) {
  const u = o.u, h = u / 2;

  const gflip = o.grav < 0 ? -1 : 1;
  switch (o.mode) {
    case 'cube': ctx.rotate(o.rot); drawCubeIcon(ctx, u, prim, sec, style); break;
    case 'ship': {

      ctx.beginPath();

      ctx.fillStyle = sec; ctx.fill(); ctx.lineWidth = Math.max(1.5, u * 0.07); ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.fillStyle = prim; ctx.fillRect(-u * 0.4, u * 0.17, u * 0.75, u * 0.09);

      ctx.fillStyle = sec;

      ctx.beginPath(); ctx.arc(0, 0, h * 0.28, 0, Math.PI * 2); ctx.fillStyle = prim; ctx.fill(); ctx.stroke();

      ctx.scale(1, gflip);
      ctx.beginPath(); ctx.arc(0, -u * 0.05, u * 0.33, Math.PI, 0); ctx.closePath(); ctx.fillStyle = 'rgba(180,240,255,0.35)'; ctx.fill();
      ctx.save(); ctx.translate(0, -u * 0.17); drawCubeIcon(ctx, u * 0.32, prim, sec, style); ctx.restore();
      ctx.beginPath(); ctx.ellipse(0, u * 0.12, u * 0.62, u * 0.2, 0, 0, Math.PI * 2); ctx.fillStyle = sec; ctx.fill();
      ctx.lineWidth = Math.max(1.5, u * 0.06); ctx.strokeStyle = '#000'; ctx.stroke();

    case 'wave': {
      ctx.rotate(-Math.atan2(o.vy, o.speed));
      ctx.beginPath(); ctx.moveTo(h * 1.1, 0); ctx.lineTo(-h * 0.8, -h * 0.75); ctx.lineTo(-h * 0.35, 0); ctx.lineTo(-h * 0.8, h * 0.75); ctx.closePath();
      ctx.fillStyle = prim; ctx.fill(); ctx.lineWidth = Math.max(1.5, u * 0.07); ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(h * 0.55, 0); ctx.lineTo(-h * 0.35, -h * 0.35); ctx.lineTo(-h * 0.1, 0); ctx.lineTo(-h * 0.35, h * 0.35); ctx.closePath(); ctx.fillStyle = sec; ctx.fill();
      break;
    }
    case 'robot': {
      ctx.scale(1, gflip);
      const air = !o.grounded, ph = o.x * 3.2;
      ctx.lineCap = 'round'; ctx.lineWidth = u * 0.14; ctx.strokeStyle = sec;
      for (const k of [-1, 1]) {
        const sw = air ? 0 : Math.sin(ph + (k > 0 ? Math.PI : 0)) * 0.22;
        const kx = k * u * 0.16, fy = air ? u * 0.22 : u * 0.48;
        ctx.beginPath(); ctx.moveTo(kx, u * 0.05); ctx.lineTo(kx + sw * u, fy); ctx.lineTo(kx + sw * u + u * 0.14, fy); ctx.stroke();
      }
      ctx.save(); ctx.translate(0, -u * 0.18); drawCubeIcon(ctx, u * 0.62, prim, sec, style); ctx.restore();
      break;
    }
    case 'spider': {
      ctx.scale(1, gflip);
      ctx.lineCap = 'round'; ctx.lineWidth = u * 0.1; ctx.strokeStyle = sec;
      const ph = o.x * 4;
      for (let i = 0; i < 4; i++) {
        const k = i < 2 ? -1 : 1, sp = (i % 2 ? 0.5 : 0.25) * k, w = Math.sin(ph + i * 1.7) * 0.08;
        ctx.beginPath(); ctx.moveTo(k * u * 0.15, u * 0.05); ctx.lineTo(u * (sp + w) * 1.1, -u * 0.05); ctx.lineTo(u * (sp + w) * 1.3, u * 0.48); ctx.stroke();
      }
      ctx.beginPath(); ctx.ellipse(0, -u * 0.08, u * 0.42, u * 0.27, 0, 0, Math.PI * 2); ctx.fillStyle = prim; ctx.fill();
      ctx.lineWidth = Math.max(1.5, u * 0.06); ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.fillStyle = sec; ctx.fillRect(u * 0.08, -u * 0.18, u * 0.14, u * 0.12); ctx.fillRect(u * 0.26, -u * 0.18, u * 0.1, u * 0.12);
      break;
    }
    case 'swing': {
      ctx.scale(1, gflip);
      ctx.fillStyle = sec; ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1.5, u * 0.06);
      for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-u * 0.35, k * u * 0.2); ctx.lineTo(u * 0.05, k * u * 0.55); ctx.lineTo(u * 0.3, k * u * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
      ctx.beginPath(); ctx.arc(0, 0, u * 0.36, 0, Math.PI * 2); ctx.fillStyle = prim; ctx.fill(); ctx.stroke();
      ctx.save(); ctx.rotate(o.rot * 0.25); ctx.fillStyle = sec; ctx.fillRect(-u * 0.14, -u * 0.14, u * 0.28, u * 0.28); ctx.restore();
      break;
    }
  }
  ctx.restore();
}

function drawFace(cv, diff) {
  const x = cv.getContext('2d'), W = cv.width; x.clearRect(0, 0, W, W);

    for (const k of [-1, 1]) { x.beginPath(); x.moveTo(k * 26, -42); x.lineTo(k * 52, -76); x.lineTo(k * 48, -30); x.closePath(); x.fill(); x.stroke(); }
  }
  x.shadowColor = col; x.shadowBlur = 18;
  x.beginPath(); x.arc(0, 0, 58, 0, Math.PI * 2); x.fillStyle = col; x.fill(); x.shadowBlur = 0; x.lineWidth = 6; x.strokeStyle = '#000'; x.stroke();
  x.fillStyle = '#000';
  const eye = (ex, ey, ang) => { x.save(); x.translate(ex, ey); x.rotate(ang); x.fillRect(-9, -11, 18, 22); x.restore(); };
  if (diff === 'Easy') { eye(-20, -12, 0); eye(20, -12, 0); x.lineWidth = 7; x.beginPath(); x.arc(0, 4, 28, 0.2, Math.PI - 0.2); x.stroke(); }
  else if (diff === 'Normal') { eye(-20, -12, 0); eye(20, -12, 0); x.lineWidth = 7; x.beginPath(); x.moveTo(-22, 26); x.quadraticCurveTo(0, 36, 22, 26); x.stroke(); }
  else if (diff === 'Hard') { eye(-20, -10, 0.3); eye(20, -10, -0.3); x.lineWidth = 7; x.beginPath(); x.moveTo(-24, 30); x.lineTo(24, 30); x.stroke(); }
  else { eye(-20, -8, 0.6); eye(20, -8, -0.6); x.lineWidth = 7; x.beginPath(); x.arc(0, 44, 26, Math.PI + 0.35, -0.35); x.stroke(); }
  x.restore();

let toastTimer = 0;
