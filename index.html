// =====================================================================
// SECTION: Game loop + state machine
// =====================================================================
const G = {
  L: null, levelIndex: 0, st: null, prevX: 0, prevY: 0, acc: 0, events: [],
  attempt: 0, practice: false, checkpoints: [], history: [], histTimer: 0, autoTimer: 0,
  dying: false, deathTimer: 0, completing: false, completeTimer: 0, completeShown: false,
  paused: false, sessionJumps: 0, sessionTime: 0, song: null, newBestShown: false,
  vis: null,
};
function freshVisuals(st) {
  return { rot: 0, waveTrail: [], floor: st.corridor ? st.corridor.floor : 0, ceil: st.corridor ? st.corridor.ceil : 60, pulse: 0, flash: 0, trailT: 0, fly: null };
}

function startLevel(i, practice) {
  AudioSys.init();
  G.levelIndex = i; G.L = prepareLevel(LEVELS[i]); G.practice = !!practice;
  G.attempt = 0; G.checkpoints = []; G.sessionJumps = 0; G.sessionTime = 0;
  G.song = makeSong(LEVELS[i].seed, LEVELS[i].bpm, LEVELS[i].music.style);
  G.paused = false;
  Particles.clear();
  UI.show('game');
  syncHudOptions();
  newAttempt(true);
}

function newAttempt(fromStart) {
  const L = G.L;
  G.attempt++;
  const lv = Save.lv(L.meta.id); lv.attempts++; Save.save();
  const cp = (G.practice && !fromStart && G.checkpoints.length) ? G.checkpoints[G.checkpoints.length - 1] : null;
  if (fromStart) G.checkpoints = [];
  G.st = cp ? cloneState(cp.state) : createState(L);
  G.st.buf = 0; G.st.dead = false;
  G.prevX = G.st.x; G.prevY = G.st.y;
  G.dying = false; G.completing = false; G.completeShown = false; G.acc = 0;
  G.history = []; G.histTimer = 0; G.autoTimer = 0; G.newBestShown = false;
  G.vis = freshVisuals(G.st); G.waveDir = 2;
  Input.pressed = false;
  updateCamera(G.st, G.st.x, G.st.y, 0, true);
  if (G.practice) { if (!AudioSys.playing) AudioSys.playSong(G.song, 0); }
  else AudioSys.playSong(G.song, 0);
}

function restartLevel() { if (!G.L) return; G.paused = false; UI.show('game'); Particles.clear(); newAttempt(true); }

function pauseGame() {
  if (UI.screen !== 'game' || G.completing) return;
  G.paused = true; AudioSys.stopSong(0.05); Input.clear();
  const def = G.L.meta, lv = Save.lv(def.id);
  $('pauseName').textContent = def.name;
  $('pauseMode').textContent = (G.practice ? 'Practice mode' : 'Normal mode') + ' · Attempt ' + G.attempt;
  setBar('pNormal', lv.normal); setBar('pPractice', lv.practice);
  $('pPracticeBtn').textContent = G.practice ? '◆ Exit Practice' : '◆ Practice';
  syncHudOptions();
  UI.show('pause');
}
function resumeGame() {
  if (!G.paused) return;
  G.paused = false; G.acc = 0; Input.clear();
  UI.show('game');
  if (G.practice) AudioSys.playSong(G.song, AudioSys.pausedAt);
  else AudioSys.playSong(G.song, G.st.t);
}
function quitToMenu() {
  G.paused = false; G.L = null; AudioSys.stopSong(0.1); Particles.clear(); Input.clear();
  UI.show('levels');
  startMenuMusic();
}
function togglePractice() {
  G.practice = !G.practice;
  G.paused = false; UI.show('game'); syncHudOptions();
  AudioSys.stopSong(0.02);
  Particles.clear(); newAttempt(true);
}

function progressPct(st, L) { return clamp(st.x / L.length * 100, 0, 100); }

function placeCheckpoint(state) {
  if (!G.practice || !state || state.dead || state.done) return;
  G.checkpoints.push({ state: cloneState(state) });
  G.autoTimer = 0;
  Particles.ring(state.x, state.y, '#3dff7a', 0.2, 1.4, 0.35);
  AudioSys.sfx('checkpoint');
}
function removeCheckpoint() { if (G.practice && G.checkpoints.length) { G.checkpoints.pop(); AudioSys.sfx('click'); } }

function gameTick() {
  const st = G.st, L = G.L;
  G.prevX = st.x; G.prevY = st.y;
  const pressed = Input.consumePress(), held = Input.held;
  const ev = G.events; ev.length = 0;
  const jumps0 = st.jumps;
  stepSim(L, st, held, pressed, ev);
  G.sessionJumps += st.jumps - jumps0;
  // wave trail: add a vertex wherever the vertical direction changes (including floor/ceiling slides)
  if (st.mode === 'wave') {
    const dy = st.y - G.prevY, dir = dy > 1e-6 ? 1 : dy < -1e-6 ? -1 : 0;
    if (dir !== G.waveDir) { G.vis.waveTrail.push([G.prevX, G.prevY]); G.waveDir = dir; }
  }
  for (const e of ev) handleEvent(e);
  if (G.practice && !st.dead && !st.done) {
    G.histTimer += TICK;
    if (G.histTimer >= CONFIG.PRACTICE.HISTORY_STEP) { G.histTimer = 0; G.history.push(cloneState(st)); if (G.history.length > 40) G.history.shift(); }
    if (S().autoCheckpoints) {
      G.autoTimer += TICK;
      if (G.autoTimer >= CONFIG.PRACTICE.AUTO_INTERVAL) {
        if (GROUND_MODES.has(st.mode)) {
          if (st.grounded && st.groundTicks >= CONFIG.PRACTICE.GROUND_TICKS) placeCheckpoint(st);
        } else {
          const target = st.t - CONFIG.PRACTICE.BEHIND_TIME; let snap = null;
          for (const h of G.history) if (h.t <= target) snap = h;
          const last = G.checkpoints[G.checkpoints.length - 1];
          if (snap && (!last || snap.x > last.state.x + 1)) placeCheckpoint(snap);
        }
      }
    }
  }
}

function handleEvent(e) {
  const st = G.st, c = Save.data.colors;
  switch (e.type) {
    case 'jump': AudioSys.sfx('jump'); break;
    case 'flip': AudioSys.sfx('flip'); break;
    case 'land':
      if (st.mode === 'cube' || st.mode === 'robot') for (let i = 0; i < 5; i++) Particles.spawn({ x: st.x - 0.3, y: st.y - st.grav * bodyHalf(st), vx: -2 - Math.random() * 3, vy: st.grav * Math.random() * 3, life: 0.35, max: 0.35, size: 0.12, color: c.primary, rot: 0, vr: 0, g: -st.grav * 8, sq: true });
      break;
    case 'orb': AudioSys.sfx('orb'); Particles.ring(e.x, e.y, ORB_COLORS[e.color], 0.4, 1.8, 0.35); G.vis.pulse = 1; break;
    case 'pad': AudioSys.sfx('pad'); Particles.ring(e.x, e.y + 0.2, ORB_COLORS[e.color], 0.3, 1.5, 0.35); break;
    case 'portal': AudioSys.sfx('portal'); Particles.ring(e.x, e.y, e.color, 0.5, 3.2, 0.5); G.vis.pulse = 1; G.vis.pulseColor = e.color;
      if (st.mode === 'wave') { G.vis.waveTrail = [[st.x, st.y]]; G.waveDir = 2; } break;
    case 'teleport': AudioSys.sfx('teleport'); Particles.streak(e.x, e.y0, e.y1, c.primary); break;
    case 'death': onDeath(); break;
    case 'complete': onComplete(); break;
  }
}

function onDeath() {
  const st = G.st, L = G.L, c = Save.data.colors;
  G.dying = true; G.deathTimer = CONFIG.DEATH_PAUSE;
  Particles.burst(st.x, st.y, 36, [c.primary, c.secondary, '#ffffff'], 11, 0.9, 0.3, -6);
  Particles.ring(st.x, st.y, c.primary, 0.3, 3.5, 0.45);
  cam.shake = CONFIG.CAMERA.SHAKE_DEATH; G.vis.flash = 0.55;
  AudioSys.sfx('death');
  if (!G.practice) AudioSys.stopSong(0.15);
  const pct = progressPct(st, L), lv = Save.lv(L.meta.id);
  lv.jumps += 0;
  const key = G.practice ? 'practice' : 'normal';
  if (pct > lv[key] + 1e-6) {
    const prev = lv[key]; lv[key] = Math.floor(pct * 100) / 100;
    if (!G.practice && Math.floor(pct) > Math.floor(prev) && pct >= 3) { toast('New Best! ' + fmtPct(pct)); AudioSys.sfx('best'); }
  }
  Save.save();
}

function onComplete() {
  const L = G.L, lv = Save.lv(L.meta.id), c = Save.data.colors;
  G.completing = true; G.completeTimer = 0; G.completeShown = false;
  if (G.practice) lv.practice = 100; else { lv.normal = 100; lv.completed = true; }
  lv.jumps += G.sessionJumps;
  Save.save();
  AudioSys.sfx('complete');
  G.vis.fly = { x: G.st.x, y: G.st.y, vx: G.st.speed, vy: 2, rot: G.vis.rot };
  for (let k = 0; k < 4; k++) Particles.burst(L.length + 0.5, G.st.y + k * 2 - 2, 26, [c.primary, c.secondary, '#ffffff', '#ffe23a'], 14, 1.4, 0.3, -4);
  Particles.ring(L.length, G.st.y, '#ffffff', 0.5, 6, 0.8);
}
function showComplete() {
  G.completeShown = true;
  $('cmpBanner').textContent = G.practice ? 'PRACTICE COMPLETE!' : 'LEVEL COMPLETE!';
  $('cmpName').textContent = G.L.meta.name;
  $('cmpAttempts').textContent = G.attempt;
  $('cmpJumps').textContent = G.sessionJumps;
  const t = Math.floor(G.sessionTime);
  $('cmpTime').textContent = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  UI.show('complete');
}

function syncHudOptions() {
  const s = S();
  $('hudBar').style.display = s.showProgress ? '' : 'none';
  $('hudPct').style.display = s.showPercent ? '' : 'none';
  $('optProgress').checked = s.showProgress; $('optPercent').checked = s.showPercent; $('optAutoCp').checked = s.autoCheckpoints;
  $('practiceBtns').classList.toggle('active', G.practice);
  $('hudFill').classList.toggle('practice', G.practice);
}

// ---- visual-only per-frame updates ----
function updateVisuals(dt, st, px, py) {
  const v = G.vis, c = Save.data.colors;
  // cube rotation: 180° per jump, snap to 90° on ground
  if (st.mode === 'cube' && !st.dead) {
    if (!st.grounded) v.rot += st.grav * CONFIG.CUBE.ROT_SPEED * (st.mini ? 1.15 : 1) * dt;
    else { const q = Math.PI / 2, tgt = Math.round(v.rot / q) * q; v.rot += (tgt - v.rot) * Math.min(1, dt * 22); }
  } else if (st.mode === 'ball') v.rot += st.grav * (st.speed / (playerSize(st) / 2)) * dt;
  else if (st.mode === 'swing') v.rot += dt * 8;
  else v.rot = 0;
  // corridor visuals
  const tf = st.corridor ? st.corridor.floor : 0, tc = st.corridor ? st.corridor.ceil : cam.y + viewH() + 4;
  v.floor += (tf - v.floor) * Math.min(1, dt * 9); v.ceil += (tc - v.ceil) * Math.min(1, dt * 9);
  v.pulse = Math.max(0, v.pulse - dt * 3); v.flash = Math.max(0, v.flash - dt * 1.6);
  // trail particles
  if (!st.dead && !G.completing) {
    v.trailT += dt;
    const rate = st.mode === 'ship' || st.mode === 'swing' ? 0.012 : 0.03;
    while (v.trailT > rate) {
      v.trailT -= rate;
      const h = playerSize(st) / 2;
      if (st.mode === 'ship' || st.mode === 'swing' || st.mode === 'ufo') {
        Particles.spawn({ x: px - h * 0.9, y: py - st.grav * h * 0.1, vx: -3 - Math.random() * 3, vy: (Math.random() - 0.5) * 2, life: 0.4, max: 0.4, size: 0.18 * (st.mini ? 0.6 : 1), color: Math.random() < 0.5 ? '#ffb52e' : c.secondary, rot: 0, vr: 0, g: 0, sq: false });
      } else if (st.mode !== 'wave' && st.grounded) {
        Particles.spawn({ x: px - h, y: py - st.grav * h + st.grav * 0.05, vx: -1 - Math.random() * 2, vy: st.grav * Math.random() * 1.5, life: 0.3, max: 0.3, size: 0.1, color: c.primary, rot: 0, vr: 0, g: 0, sq: true });
      } else if (st.mode !== 'wave') {
        Particles.spawn({ x: px - h * 0.6, y: py + (Math.random() - 0.5) * h, vx: -1, vy: 0, life: 0.25, max: 0.25, size: 0.12, color: c.secondary, rot: 0, vr: 0, g: 0, sq: true });
      }
    }
  }
  if (st.mode === 'wave') { const tr = v.waveTrail; if (!tr.length) tr.push([px, py]); while (tr.length > 2 && tr[1][0] < px - 45) tr.shift(); }
  else v.waveTrail.length = 0;
}

// ---- main render of the game world ----
function renderGame(alpha, dt) {
  const ctx = R.ctx, L = G.L, st = G.st, v = G.vis;
  let px = G.prevX + (st.x - G.prevX) * alpha, py = G.prevY + (st.y - G.prevY) * alpha;
  if (G.completing && v.fly) { px = v.fly.x; py = v.fly.y; }
  const songT = AudioSys.playing ? AudioSys.songTime() : st.t;
  const beat = (songT * L.meta.bpm / 60) % 1, pulse = Math.pow(1 - (beat < 0 ? beat + 1 : beat), 4);
  const pal = palette(colorsAt(L, px));
  drawBackground(ctx, pal, pulse);
  drawObjects(ctx, L, pal, pulse, performance.now() / 1000, new Set(st.used));
  // attempt text lives in the world and scrolls past
  setScreen(ctx);
  if (!S().hideAttempts) {
    const [ax, ay] = toScreen(12, 8.5);
    if (ax > -400 && ax < R.W + 400) {
      ctx.font = `900 ${Math.round(R.ppu * 1.5)}px "Arial Black", "Segoe UI", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, R.ppu * 0.18); ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText('Attempt ' + G.attempt, ax, ay);
      ctx.fillStyle = '#fff'; ctx.fillText('Attempt ' + G.attempt, ax, ay);
      if (G.practice) { ctx.font = `800 ${Math.round(R.ppu * 0.7)}px "Segoe UI", sans-serif`; ctx.fillStyle = '#7fe8ff'; ctx.fillText('PRACTICE MODE', ax, ay + R.ppu * 1.4); }
    }
  }
  // practice checkpoints
  if (G.practice) {
    setWorld(ctx);
    for (const cp of G.checkpoints) {
      const s = cp.state; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.PI / 4);
      ctx.shadowColor = '#3dff7a'; ctx.shadowBlur = 12 * R.dpr; ctx.fillStyle = '#3dff7a'; ctx.fillRect(-0.25, -0.25, 0.5, 0.5);
      ctx.strokeStyle = '#0b3a1a'; ctx.lineWidth = 0.06; ctx.strokeRect(-0.25, -0.25, 0.5, 0.5); ctx.restore();
    }
  }
  drawWaveTrail(ctx, st, px, py);
  // player
  if (!st.dead && !(G.completing && v.fly && v.fly.gone)) drawPlayerAt(ctx, st, px, py);
  drawParticles(ctx);
  drawGroundAndCeiling(ctx, pal, v);
  if (S().hitboxes || (G.practice && S().practiceHitboxes)) drawHitboxes(ctx, L, st, px, py);
  // portal pulse + death flash
  setScreen(ctx);
  if (v.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${v.flash})`; ctx.fillRect(0, 0, R.W, R.H); }
  // HUD
  const pct = progressPct(st, L);
  $('hudFill').style.width = pct + '%';
  $('hudPct').textContent = fmtPct(pct);
}

function drawPlayerAt(ctx, st, px, py) {
  const c = Save.data.colors, v = G.vis;
  setScreen(ctx);
  const [sx, sy] = toScreen(px, py);
  const u = playerSize(st) * R.ppu * (1 + v.pulse * 0.25);
  ctx.save(); ctx.translate(sx, sy);
  if (v.pulse > 0) {
    ctx.beginPath(); ctx.arc(0, 0, u * (0.8 + (1 - v.pulse) * 1.2), 0, Math.PI * 2);
    ctx.strokeStyle = rgb(hexToRgb(v.pulseColor || '#ffffff'), v.pulse * 0.8); ctx.lineWidth = 3; ctx.stroke();
  }
  drawPlayerShape(ctx, { mode: st.mode, u, rot: v.rot, vy: st.vy, speed: st.speed, grav: st.grav, x: st.x, grounded: st.grounded, t: st.t }, c.primary, c.secondary, c.icon);
  ctx.restore();
}

function drawWaveTrail(ctx, st, px, py) {
  const tr = G.vis.waveTrail;
  if (st.mode !== 'wave' || !tr.length || st.dead) return;
  setWorld(ctx);
  const c = Save.data.colors;
  ctx.save();
  ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(tr[0][0], tr[0][1]);
  for (const p of tr) ctx.lineTo(p[0], p[1]);
  ctx.lineTo(px, py);
  ctx.shadowColor = c.secondary; ctx.shadowBlur = 14 * R.dpr;
  ctx.strokeStyle = c.secondary; ctx.lineWidth = (st.mini ? 0.18 : 0.3); ctx.globalAlpha = 0.55; ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = (st.mini ? 0.06 : 0.1); ctx.stroke();
  ctx.restore();
}

function drawParticles(ctx) {
  setWorld(ctx);
  for (const p of Particles.list) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    if (p.sq) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const r of Particles.rings) {
    const f = 1 - r.life / r.max;
    ctx.globalAlpha = 1 - f; ctx.strokeStyle = r.color; ctx.lineWidth = 0.12 * (1 - f) + 0.03;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * f, 0, Math.PI * 2); ctx.stroke();
  }
  for (const s of Particles.streaks) {
    const f = s.life / s.max;
    ctx.globalAlpha = f; ctx.fillStyle = s.color;
    ctx.fillRect(s.x - 0.35 * f, Math.min(s.y0, s.y1), 0.7 * f, Math.abs(s.y1 - s.y0));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 0.08 * f, Math.min(s.y0, s.y1), 0.16 * f, Math.abs(s.y1 - s.y0));
  }
  ctx.globalAlpha = 1;
}

function drawHitboxes(ctx, L, st, px, py) {
  setWorld(ctx);
  const lw = 1.5 / R.ppu;
  ctx.lineWidth = lw;
  for (const o of query(L, cam.x - 2, cam.x + viewW() + 2)) {
    if (o.cat === SOLID) ctx.strokeStyle = '#3d8bff';
    else if (o.cat === HAZARD) ctx.strokeStyle = '#ff3b3b';
    else ctx.strokeStyle = '#3dff7a';
    if (o.type === 'saw') { ctx.beginPath(); ctx.arc(o.cx, o.cy, o.hr, 0, Math.PI * 2); ctx.stroke(); }
    else ctx.strokeRect(o.x0, o.y0, o.x1 - o.x0, o.y1 - o.y0);
  }
  if (st.dead) return;
  const h = bodyHalf(st);
  ctx.strokeStyle = '#ff3b3b'; ctx.strokeRect(px - h, py - h, h * 2, h * 2);
  if (st.mode !== 'wave') { const ih = playerSize(st) * CONFIG.INNER_HITBOX / 2; ctx.strokeStyle = '#3d8bff'; ctx.strokeRect(px - ih, py - ih, ih * 2, ih * 2); }
  if (st.corridor) { ctx.strokeStyle = '#3d8bff'; ctx.beginPath(); ctx.moveTo(cam.x, st.corridor.floor); ctx.lineTo(cam.x + viewW(), st.corridor.floor); ctx.moveTo(cam.x, st.corridor.ceil); ctx.lineTo(cam.x + viewW(), st.corridor.ceil); ctx.stroke(); }
}

// ---- menu background: an endless demo run with an autopilot ----
const Demo = { L: null, st: null, plan: [], next: 0, acc: 0, prevX: 0, prevY: 0, hue: 220, vis: null, held: false };
function buildDemo() {
  const b = new LevelBuilder({ id: 'demo', name: 'demo', bpm: 133, seed: 7, startSpeed: 1, startMode: 'cube', colors: { bg: '#1d4fe0', ground: '#173bb0' } });
  const rnd = mulberry32(99); const plan = [];
  b.beats(4);
  for (let i = 0; i < 90; i++) {
    const n = rnd() < 0.55 ? 1 : rnd() < 0.7 ? 2 : 3;
    plan.push(b.x); b.jump(n); b.beats(rnd() < 0.3 ? 1 : 2);
  }
  Demo.L = prepareLevel(b.build(30)); Demo.plan = plan;
  resetDemo();
}
function resetDemo() { Demo.st = createState(Demo.L); Demo.next = 0; Demo.prevX = 0; Demo.prevY = 0.5; Demo.vis = freshVisuals(Demo.st); }
function updateDemo(dt) {
  Demo.acc += dt;
  while (Demo.acc >= TICK) {
    Demo.acc -= TICK;
    const st = Demo.st; Demo.prevX = st.x; Demo.prevY = st.y;
    let press = false;
    if (Demo.next < Demo.plan.length && st.x >= Demo.plan[Demo.next]) { press = true; Demo.next++; }
    stepSim(Demo.L, st, press, press, null);
    if (st.dead || st.x > Demo.L.length - 25) resetDemo();
  }
}
function renderDemo(dt) {
  const ctx = R.ctx, st = Demo.st, a = Demo.acc / TICK;
  const px = Demo.prevX + (st.x - Demo.prevX) * a, py = Demo.prevY + (st.y - Demo.prevY) * a;
  updateCamera(st, px, py, dt, false);
  const v = Demo.vis;
  if (!st.grounded) v.rot += CONFIG.CUBE.ROT_SPEED * dt; else { const q = Math.PI / 2; v.rot += (Math.round(v.rot / q) * q - v.rot) * Math.min(1, dt * 22); }
  Demo.hue = (Demo.hue + dt * 6) % 360;
  const bg = hslRgb(Demo.hue, 0.75, 0.45), gr = hslRgb(Demo.hue, 0.75, 0.33);
  const pal = palette({ bg, ground: gr });
  const beat = ((AudioSys.playing ? AudioSys.songTime() : performance.now() / 1000) * 120 / 60) % 1, pulse = Math.pow(1 - beat, 4);
  drawBackground(ctx, pal, pulse);
  drawObjects(ctx, Demo.L, pal, pulse, performance.now() / 1000, null);
  setScreen(ctx);
  const c = Save.data.colors, [sx, sy] = toScreen(px, py);
  ctx.save(); ctx.translate(sx, sy);
  drawPlayerShape(ctx, { mode: 'cube', u: R.ppu, rot: v.rot, vy: st.vy, speed: st.speed, grav: 1, x: st.x, grounded: st.grounded }, c.primary, c.secondary, c.icon);
  ctx.restore();
  drawGroundAndCeiling(ctx, pal, { floor: 0, ceil: 999 });
  // dim the playfield behind menus
  setScreen(ctx); ctx.fillStyle = 'rgba(4,6,20,0.28)'; ctx.fillRect(0, 0, R.W, R.H);
}
function hslRgb(h, s, l) {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}

// ---- customize preview (all eight modes) ----
function renderCustomPreview(t) {
  const cv = $('customPreview'), x = cv.getContext('2d'), c = Save.data.colors;
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, cv.width, cv.height);
  const n = MODES.length, w = cv.width / n, u = Math.min(w * 0.55, cv.height * 0.42);
  MODES.forEach((m, i) => {
    x.save(); x.translate(w * (i + 0.5), cv.height * 0.45 + Math.sin(t * 3 + i) * 6);
    const saveDpr = R.dpr; R.dpr = 1;
    drawPlayerShape(x, { mode: m, u, rot: m === 'ball' ? t * 3 : 0, vy: m === 'wave' ? Math.sin(t * 2 + i) * 8 : Math.sin(t * 2) * 4, speed: 10, grav: 1, x: t * 2, grounded: true, t }, c.primary, c.secondary, c.icon);
    R.dpr = saveDpr;
    x.restore();
    x.fillStyle = 'rgba(255,255,255,0.7)'; x.font = '700 22px "Segoe UI", sans-serif'; x.textAlign = 'center';
    x.fillText(m.toUpperCase(), w * (i + 0.5), cv.height - 14);
  });
}

// ---- menu music ----
let menuSong = null;
function startMenuMusic() {
  if (!AudioSys.ctx) return;
  if (!menuSong) menuSong = makeSong(5150, 120, 0);
  if (!AudioSys.playing || AudioSys.song !== menuSong) AudioSys.playSong(menuSong, 0);
}

// ---- the loop ----
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  dt = Math.min(Math.max(dt, 0), CONFIG.MAX_FRAME_TIME);
  const inGame = G.L && (UI.screen === 'game' || UI.screen === 'pause' || UI.screen === 'complete');
  if (inGame) {
    const st = G.st;
    if (!G.paused) {
      if (!G.dying && !G.completing) {
        G.acc += dt;
        while (G.acc >= TICK) {
          G.acc -= TICK; gameTick();
          if (G.dying || G.completing) { G.acc = 0; break; }
        }
        G.sessionTime += dt;
      } else if (G.dying) {
        G.deathTimer -= dt;
        if (G.deathTimer <= 0) { Particles.clear(); newAttempt(false); }
      } else if (G.completing) {
        G.completeTimer += dt;
        const f = G.vis.fly;
        if (f) { f.vx += 18 * dt; f.vy += 22 * dt; f.x += f.vx * dt; f.y += f.vy * dt; G.vis.rot += 10 * dt; if (Math.random() < 0.8) Particles.spawn({ x: f.x - 0.4, y: f.y, vx: -4, vy: 0, life: 0.5, max: 0.5, size: 0.25, color: Save.data.colors.secondary, rot: 0, vr: 0, g: 0, sq: false }); }
        if (G.completeTimer >= CONFIG.COMPLETE_DELAY && !G.completeShown) showComplete();
      }
      Particles.update(dt);
    }
    const alpha = (G.dying || G.completing) ? 1 : G.acc / TICK;
    const px = G.prevX + (G.st.x - G.prevX) * alpha, py = G.prevY + (G.st.y - G.prevY) * alpha;
    if (!G.paused) { updateVisuals(dt, G.st, px, py); updateCamera(G.st, G.completing ? G.L.length : px, G.completing ? G.st.y : py, dt, false); }
    renderGame(alpha, dt);
    void st;
  } else {
    updateDemo(dt); Particles.update(dt);
    renderDemo(dt);
    if (UI.screen === 'custom') renderCustomPreview(now / 1000);
  }
  requestAnimationFrame(frame);
}

// =====================================================================
// SECTION: Wiring (events for input + UI)
// =====================================================================
function actionDown(id, isKey) {
  AudioSys.init();
  if (UI.screen === 'game') {
    if (isKey) { if (!Input.keys.has(id)) Input.pressed = true; Input.keys.add(id); }
    else { Input.pointers.add(id); Input.pressed = true; }
  }
}
function actionUp(id, isKey) { if (isKey) Input.keys.delete(id); else Input.pointers.delete(id); }

window.addEventListener('keydown', (e) => {
  const k = e.code;
  if (ACTION_KEYS.has(k) || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
    if (!(e.target instanceof HTMLInputElement) || UI.screen === 'game') e.preventDefault();
  }
  AudioSys.init();
  if (UI.screen === 'menu' && !AudioSys.playing) startMenuMusic();
  switch (UI.screen) {
    case 'game':
      if (ACTION_KEYS.has(k)) { if (!e.repeat) actionDown(k, true); }
      else if (k === 'Escape') pauseGame();
      else if (k === 'KeyR') restartLevel();
      else if (k === 'KeyP') { S().hitboxes = !S().hitboxes; Save.save(); }
      else if (k === 'KeyZ') placeCheckpoint(G.st);
      else if (k === 'KeyX') removeCheckpoint();
      break;
    case 'pause':
      if (k === 'Escape' || k === 'Space') { e.preventDefault(); resumeGame(); }
      else if (k === 'KeyR') restartLevel();
      break;
    case 'menu':
      if (k === 'Space' || k === 'Enter') { e.preventDefault(); UI.show('levels'); }
      break;
    case 'levels':
      if (k === 'ArrowLeft') UI.page(-1);
      else if (k === 'ArrowRight') UI.page(1);
      else if (k === 'Enter' || k === 'Space') { e.preventDefault(); startLevel(UI.sel, false); }
      else if (k === 'Escape') UI.show('menu');
      break;
    case 'custom': case 'settings':
      if (k === 'Escape') UI.show('menu');
      break;
    case 'complete':
      if (k === 'Enter' || k === 'Space') { e.preventDefault(); restartLevel(); }
      else if (k === 'Escape') quitToMenu();
      break;
  }
});
window.addEventListener('keyup', (e) => { if (ACTION_KEYS.has(e.code)) actionUp(e.code, true); });
R.cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  actionDown(e.pointerId, false);
});
window.addEventListener('pointerup', (e) => actionUp(e.pointerId, false));
window.addEventListener('pointercancel', (e) => actionUp(e.pointerId, false));
window.addEventListener('blur', () => { Input.clear(); if (UI.screen === 'game') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && UI.screen === 'game') pauseGame(); });
document.addEventListener('touchmove', (e) => { if (UI.screen === 'game' || e.target === R.cv) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', (e) => { if (e.target === R.cv) e.preventDefault(); });

const click = (id, fn) => $(id).addEventListener('click', (e) => { AudioSys.init(); AudioSys.sfx('click'); fn(e); });
click('btnPlay', () => { UI.show('levels'); startMenuMusic(); });
click('btnCustom', () => { UI.show('custom'); startMenuMusic(); });
click('btnSettings', () => { UI.show('settings'); startMenuMusic(); });
for (const b of document.querySelectorAll('[data-back]')) b.addEventListener('click', () => { AudioSys.sfx('click'); UI.show('menu'); });
$('lsPrev').addEventListener('click', () => UI.page(-1));
$('lsNext').addEventListener('click', () => UI.page(1));
$('levelCard').addEventListener('click', () => startLevel(UI.sel, false));
$('levelCard').addEventListener('keydown', (e) => { if (e.key === 'Enter') startLevel(UI.sel, false); });
// pause button must not count as a jump
for (const id of ['btnPause', 'btnCpPlace', 'btnCpRemove']) $(id).addEventListener('pointerdown', (e) => e.stopPropagation());
$('btnPause').addEventListener('click', () => pauseGame());
$('btnCpPlace').addEventListener('click', () => placeCheckpoint(G.st));
$('btnCpRemove').addEventListener('click', () => removeCheckpoint());
click('pResume', resumeGame);
click('pRestart', restartLevel);
click('pPracticeBtn', togglePractice);
click('pQuit', quitToMenu);
click('cmpReplay', restartLevel);
click('cmpMenu', quitToMenu);
for (const [id, key] of [['optProgress', 'showProgress'], ['optPercent', 'showPercent'], ['optAutoCp', 'autoCheckpoints']]) {
  $(id).addEventListener('change', (e) => { S()[key] = e.target.checked; Save.save(); syncHudOptions(); });
}
for (const [id, key] of [['volMaster', 'master'], ['volMusic', 'music'], ['volSfx', 'sfx']]) {
  $(id).addEventListener('input', (e) => { S()[key] = +e.target.value; Save.save(); AudioSys.applyVolumes(); });
}
$('volSfx').addEventListener('change', () => AudioSys.sfx('orb'));
for (const [id, key] of [['setHitbox', 'hitboxes'], ['setPracHitbox', 'practiceHitboxes'], ['setDecimals', 'decimals'], ['setHideAttempts', 'hideAttempts']]) {
  $(id).addEventListener('change', (e) => { S()[key] = e.target.checked; Save.save(); });
}
let resetArmed = false;
$('btnReset').addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; $('btnReset').textContent = 'Are you sure?'; setTimeout(() => { resetArmed = false; $('btnReset').textContent = 'Reset'; }, 3000); return; }
  resetArmed = false; Save.reset(); AudioSys.applyVolumes(); $('btnReset').textContent = 'Done!'; UI.renderSettings(); drawMenuIcon();
  setTimeout(() => { $('btnReset').textContent = 'Reset'; }, 1500);
});
// first gesture anywhere unlocks audio and starts the menu loop
window.addEventListener('pointerdown', () => { AudioSys.init(); if ((UI.screen === 'menu' || UI.screen === 'levels') && !AudioSys.playing) startMenuMusic(); }, { capture: true });

buildDemo();
UI.show('menu');
requestAnimationFrame(frame);
</script>
